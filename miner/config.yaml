# Elcaro Miner — detailed capability reference
#
# NOTE: The artifact you upload / pin for Telegraph registration is
# `miner/telegraph.yaml`, which is in Telegraph's own config format.
#
# This file is the richer internal reference: it documents the full JSON schemas
# for the flat `/scan` contract used by direct callers, the app middleware, and
# the web UI. Keep `base_url` and the intent list in sync with telegraph.yaml.

miner:
  id: elcaro
  name: "Elcaro — IPI Detection"
  description: >
    Detects indirect prompt injection (IPI) in content retrieved by AI agents.
    Scans emails, search results, code, documents, and web pages for known
    injection patterns: authority framing, delimiter confusion, task reframing,
    obfuscation, placement tricks, and conditional triggers. Returns a risk
    score, flagged techniques, and detailed indicators.
  version: "0.1.0"
  website: "https://elcaro.trustfall.xyz"
  contact: ""  # TODO: set your email/handle before registering (required by Telegraph)

# ── API endpoint ────────────────────────────────────────────────────────────────

api:
  base_url: "https://api.elcaro.trustfall.xyz"
  endpoints:
    - path: /scan
      method: POST
      description: "Scan content for indirect prompt injection (the registered endpoint)"
    - path: /v1/infer
      method: POST
      description: "Telegraph-compatible inference endpoint (alias for /scan)"
    - path: /health
      method: GET
      description: "Health check"
    - path: /
      method: GET
      description: "Miner metadata and discovery info"

# ── Supported intents ───────────────────────────────────────────────────────────
#
# WARNING: these are Elcaro-internal capability names, NOT Telegraph canonical
# intents. No INJECTION_DETECTION intent exists on the Telegraph network, and
# declaring a non-canonical intent makes registerMiner revert. The registration
# artifact (miner/telegraph.yaml) declares CONTENT_MODERATION + TEXT_CLASSIFICATION.

intents:
  - name: INJECTION_DETECTION
    description: "Detect whether content contains indirect prompt injection"
    endpoint: /scan
    request_schema:
      type: object
      properties:
        content:
          type: string
          description: "The text content to scan for injection"
        content_type:
          type: string
          enum: [email, search_result, code, document, webpage, chat_message]
          description: "Type of content being scanned (affects contextual weighting)"
          default: document
        deep_analysis:
          type: boolean
          description: "If true, run LLM second pass for ambiguous results"
          default: false
        context:
          type: string
          description: "Optional context about the consuming agent or task"
      required: [content]
    response_schema:
      type: object
      properties:
        risk_score:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: "Overall injection risk score (0=safe, 1=dangerous)"
        risk_level:
          type: string
          enum: [safe, low, suspicious, dangerous]
          description: "Categorical risk level"
        flagged_techniques:
          type: array
          items:
            type: string
            enum:
              - authority_framing
              - delimiter_confusion
              - task_reframing
              - obfuscation
              - placement_salience
              - conditional_trigger
          description: "Technique classes that triggered detection"
        indicators:
          type: array
          items:
            type: object
            properties:
              technique_class:
                type: string
                enum:
                  - authority_framing
                  - delimiter_confusion
                  - task_reframing
                  - obfuscation
                  - placement_salience
                  - conditional_trigger
              technique_name:
                type: string
                description: "Specific pattern identifier (e.g. 'authority:system_voice_marker')"
              severity:
                type: string
                enum: [info, low, medium, high, critical]
                default: medium
              confidence:
                type: number
                minimum: 0.0
                maximum: 1.0
              evidence:
                type: object
                properties:
                  matched_text:
                    type: string
                  context_before:
                    type: string
                    default: ""
                  context_after:
                    type: string
                    default: ""
                  char_offset:
                    type: integer
                    default: 0
                required: [matched_text]
              location:
                type: string
                description: "Where in the content the match was found (body, metadata, tail, etc.)"
              explanation:
                type: string
              remediation:
                type: string
                default: "Review and remove the flagged content before processing."
              ttps:
                type: array
                items:
                  type: object
                  properties:
                    framework:
                      type: string
                      description: "Reference framework: 'mitre_atlas' or 'elcaro'"
                    technique_id:
                      type: string
                      description: "Technique identifier (e.g. 'AML.T0051', 'ELC-A01')"
                    technique_name:
                      type: string
                    tactic:
                      type: string
                  required: [framework, technique_id, technique_name, tactic]
            required: [technique_class, technique_name, confidence, evidence, location, explanation]
          description: "Detailed detection indicators"
        summary:
          type: string
          default: ""
          description: "One-sentence human-readable summary of the scan result"
        content_type:
          type: string
          enum: [email, search_result, code, document, webpage, chat_message, system_prompt]
        deep_analysis_used:
          type: boolean
          default: false
        latency_ms:
          type: integer
          nullable: true
          description: "Processing latency in milliseconds"
      required: [risk_score, risk_level, content_type]

  - name: CONTENT_SAFETY_SCAN
    description: "Broader content safety scan (alias for INJECTION_DETECTION)"
    endpoint: /scan
    request_schema:
      type: object
      properties:
        content:
          type: string
        content_type:
          type: string
          enum: [email, search_result, code, document, webpage, chat_message]
          default: document
      required: [content]
    response_schema:
      type: object
      properties:
        risk_score:
          type: number
        risk_level:
          type: string
        flagged_techniques:
          type: array
          items:
            type: string

# ── Pricing ────────────────────────────────────────────────────────────────────

pricing:
  cost_per_request: 0.01  # USD
  currency: USDC
  payment_protocol: x402

# ── Registration ────────────────────────────────────────────────────────────────
#
# Steps:
#   1. Fill in miner.contact above.
#   2. Pin this file to IPFS:  PINATA_JWT=... python deploy/pin-config.py miner/config.yaml
#   3. Set ipfs_hash below to the returned CID.
#   4. Register at https://integrate.telegraphprotocol.com (Base Sepolia, wallet).
#   5. Copy registry_contract from the dashboard after registering.

registration:
  network: base-sepolia
  ipfs_pinata: true
  registry_contract: ""  # TODO: set from dashboard after registering at integrate.telegraphprotocol.com
  ipfs_hash: ""  # TODO: PINATA_JWT=... python deploy/pin-config.py miner/config.yaml
