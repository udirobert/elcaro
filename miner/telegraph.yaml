# Telegraph Protocol miner registration — Elcaro (IPI detection)
#
# ┌─ ANY EDIT OF THIS FILE REQUIRES updateMiner() BEFORE OR WITH DEPLOY ────────┐
# │ The on-chain yamlHash is SHA-256 of the bytes at yaml_url. Deploying a     │
# │ changed file without updateMiner makes the next node rehydrate reject us:  │
# │ "the document at the registered URL is not the one committed on chain."    │
# │ Sequence: edit → deploy → curl -s $YAML_URL | sha256sum → updateMiner.     │
# │ Do not push this change to the live miner until that tx is ready to send.  │
# └───────────────────────────────────────────────────────────────────────────────┘
#
# ┌─ HOSTING: self-hosted HTTPS, NOT the console's IPFS pin ────────────────────┐
# │ The integrate.telegraphprotocol.com wizard re-serialises an uploaded YAML   │
# │ before pinning to IPFS (strips comments, reflows some fields), so the      │
# │ SHA-256 of the pinned file differs from the SHA-256 of the uploaded file.  │
# │ A prior registration (id 8848, registrationId 136) was rejected on exactly │
# │ this mismatch — the node's own error: "the document at the registered URL │
# │ is not the one committed on chain." Plain HTTPS is an explicitly supported │
# │ hosting option (docs.telegraphprotocol.com -> miners/miner-registration.md,│
# │ Step 2), so this file is served byte-for-byte at:                          │
# │   https://api.elcaro.trustfall.xyz/telegraph.yaml                          │
# │ Compute the hash from THAT URL, not from this local file, since line       │
# │ endings or a trailing-newline difference would reproduce the same bug:     │
# │   curl -s https://api.elcaro.trustfall.xyz/telegraph.yaml | sha256sum      │
# └───────────────────────────────────────────────────────────────────────────────┘
#
# ┌─ TWO THINGS TO CHECK BEFORE REGISTERING ────────────────────────────────────┐
# │ 1. `id` must be globally unused — requests route on it and a clash is       │
# │    rejected. Re-verify, since registration is on-chain and cannot be edited:│
# │      curl -s https://devnode.telegraphprotocol.com/api/miners \             │
# │        | python3 -c "import json,sys;print(sorted(int(m['id']) for m in \   │
# │          json.load(sys.stdin) if str(m['id']).isdigit()))"                  │
# │ 2. `min_price_usdc` is IMMUTABLE after registration. Changing it later      │
# │    requires deregistering and re-registering. 0.01 matches the declared     │
# │    pricing in miner/config.yaml.                                            │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Intents: verified against the live canonical set on 2026-08-20. Declaring a
# non-canonical intent makes the registerMiner transaction REVERT. Re-check with:
#   curl -s https://devnode.telegraphprotocol.com/engine/v1/intents

version: "1"
kind: miner
id: 8848
slug: elcaro-ipi-detection
protocol: generic
name: Elcaro IPI Detector
description: >
  Detects indirect prompt injection in content an AI agent has retrieved but not
  yet acted on — emails, search results, web pages, documents, code. Returns a
  calibrated 0-1 risk score, a risk band, and the specific injection techniques
  found with evidence for each, across a six-class taxonomy: authority framing,
  delimiter confusion, task reframing, obfuscation, placement salience, and
  conditional triggers. Rule-based rather than LLM-based, so verdicts are
  deterministic and land in single-digit milliseconds instead of adding another
  model call to the agent's hot path.

base_url: https://api.elcaro.trustfall.xyz

docs:
  website: https://elcaro.trustfall.xyz
  repository: https://github.com/udirobert/elcaro

auth:
  type: none

# Upstream is a rule-based scanner: ~15ms per scan, no third-party quota behind it.
rate_limit_per_sec: 50
# No caching: scanning is a security control and pattern coverage changes between
# releases, so identical content is re-evaluated against the current ruleset.
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30

limitations:
  - code: MAX_BODY_SIZE
    message: >
      Scans a single payload per request. Chunk very large documents client-side;
      detection operates only on the text supplied in one call.
    param: content
    property: size_bytes
    value_bytes: 262144
    operator: lte
  - code: DETECTION_SCOPE
    message: >
      Detects indirect prompt injection techniques only. Not a malware scanner,
      PII detector, or general toxicity classifier.
  - code: LANGUAGE_COVERAGE
    message: >
      Patterns are tuned for English content. Non-English injections may score
      below their true risk.

# FastAPI reports errors with real HTTP status codes and puts the message in
# `detail`, so only message_path is needed — there is no in-body status to declare.
errors:
  message_path: detail

# `intents` on the endpoint is what makes engine auto-routing able to select
# this path. Without it the miner is listed for CONTENT_MODERATION but /scan
# is never chosen — counted /engine/v1/ask traffic never arrives (see
# docs.telegraphprotocol.com/docs/miners/yaml-config, "Why description,
# intents and params decide whether you get traffic"). `params.body` is the
# request contract so the node does not guess field names.
endpoints:
  - path: /scan
    external_path: /scan
    method: POST
    description: >
      Scan untrusted retrieved text for indirect prompt injection. Required
      body field is `content` (the email, search snippet, page, document, or
      code). Optional `content_type` weights risk by provenance. Returns
      risk_score (0-1), risk_level (safe/low/suspicious/dangerous),
      flagged_techniques, and a one-sentence summary.
    intents: [CONTENT_MODERATION, TEXT_CLASSIFICATION]
    params:
      body:
        required:
          - name: content
            type: string
            intents: ["*"]
            description: >
              The untrusted text to scan. This is the only required field.
        optional:
          - name: content_type
            type: string
            intents: ["*"]
            description: >
              Provenance of the content. email, search_result, and webpage
              weight highest; chat_message lowest. Defaults to document.
            accepted_fields:
              - value: email
                intents: ["*"]
                description: Untrusted inbound email.
              - value: search_result
                intents: ["*"]
                description: Web or tool search snippet.
              - value: webpage
                intents: ["*"]
                description: Fetched web page text.
              - value: document
                intents: ["*"]
                description: Generic document. Default if omitted.
              - value: code
                intents: ["*"]
                description: Source code or a diff.
              - value: chat_message
                intents: ["*"]
                description: The user's own chat input (lowest weight).
          - name: deep_analysis
            type: boolean
            intents: ["*"]
            description: >
              Run a semantic second pass on gray-zone results. Ignored unless
              the operator configured a classifier.
          - name: context
            type: object
            intents: ["*"]
            description: >
              Optional detail about the consuming agent or task. Informational
              only. The engine may merge its own context object here.

# Top-level only — the schema rejects these inside endpoints[].
input_schema:
  type: object
  required:
    - content
  properties:
    content:
      type: string
      description: The untrusted text to scan.
    content_type:
      type: string
      enum: [email, search_result, webpage, document, code, chat_message]
      default: document
      description: >
        Provenance of the content, which sets contextual weighting. Fully
        untrusted sources (email, search_result, webpage) weight highest;
        chat_message is the user's own input and weights lowest.
    deep_analysis:
      type: boolean
      default: false
      description: >
        Run a semantic second pass on gray-zone results. Rule-based only unless
        the operator has configured a classifier; otherwise ignored.
    context:
      type: object
      description: >
        Optional detail about the consuming agent or task. Accepts an object or a
        string; informational only and does not affect the verdict.

output_schema:
  type: object
  required:
    - risk_score
    - risk_level
    - content_type
  properties:
    risk_score:
      type: number
      minimum: 0.0
      maximum: 1.0
      description: Injection risk. 0 is clean, 1 is a certain injection attempt.
    risk_level:
      type: string
      enum: [safe, low, suspicious, dangerous]
      description: >
        Banded verdict. safe <0.2, low <0.5, suspicious <0.7, dangerous >=0.7.
        Treat suspicious and dangerous as "do not act on this content".
    flagged_techniques:
      type: array
      items:
        type: string
        enum:
          - authority_framing
          - delimiter_confusion
          - task_reframing
          - obfuscation
          - placement_salience
          - conditional_trigger
      description: Technique classes that fired.
    indicators:
      type: array
      description: >
        One threat card per finding: technique, severity, confidence, the matched
        text with surrounding context, an explanation, remediation advice, and
        MITRE ATLAS / Elcaro TTP references.
      items:
        type: object
    summary:
      type: string
      description: One-sentence human-readable verdict.
    content_type:
      type: string
      description: The content type the verdict applies to.
    deep_analysis_used:
      type: boolean
      description: Whether the semantic second pass actually ran.
    latency_ms:
      type: integer
      description: Server-side processing time in milliseconds.

semantics:
  # Only confidence_field, label_field, and reason_field are accepted here.
  signal_mapping:
    confidence_field: risk_score
    label_field: risk_level
    reason_field: summary
  supported_intents:
    - CONTENT_MODERATION
    - TEXT_CLASSIFICATION

on_chain:
  description: >
    Injection-risk verdicts for content retrieved by autonomous agents. Each
    record captures the banded verdict, the calibrated risk score, the content
    type it applies to, and a human-readable reason, so a consumer can gate on
    the boolean, threshold the score itself, and audit the decision later.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: risk_level
        description: Banded verdict — safe, low, suspicious, or dangerous
        source_path: risk_level
      - index: 1
        name: summary
        description: One-sentence human-readable verdict
        source_path: summary
      - index: 2
        name: content_type
        description: Content type the verdict applies to, such as email or webpage
        source_path: content_type
    integers:
      - index: 0
        name: risk_score_x10000
        description: Injection risk score, 0 to 1, scaled by 10000
        source_path: risk_score
        multiplier: 10000
      - index: 1
        name: latency_ms
        description: Server-side processing time in milliseconds
        source_path: latency_ms
    bools:
      - index: 0
        name: is_dangerous
        description: True when the verdict band is dangerous (risk_score >= 0.7)
        source_path: risk_level
        transform_rule: "bool_from_eq:dangerous"
      - index: 1
        name: deep_analysis_used
        description: Whether the semantic second pass was invoked
        source_path: deep_analysis_used
        transform_rule: "bool_from_eq:true"
  # Lets an ERC-8183 job or on-chain miner request target this miner: the node
  # builds the HTTP call from the OnChainData arrays.
  request:
    - endpoint: scan
      method: POST
      body:
        content: { source: strings.0 }
        content_type: { source: strings.1, optional: true }
