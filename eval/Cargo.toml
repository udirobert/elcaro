[package]
name = "elcaro-eval"
version = "0.1.0"
edition = "2021"
description = "WASM evaluation script for the Telegraph Protocol — scores miners against an adversarial IPI test corpus"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
