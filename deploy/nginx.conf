# Elcaro Miner — nginx server block
# Copy to: /etc/nginx/sites-available/elcaro
# Symlink: ln -s /etc/nginx/sites-available/elcaro /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare handles HTTPS termination. This block listens on the
# public-facing port that Cloudflare proxies to.
#
# Set the Cloudflare DNS A record for your subdomain (e.g. api.elcaro.dev)
# pointing to the VPS IP with Proxy enabled, and set the origin port
# in Cloudflare to 8847.

server {
  listen 8847;
  server_name api.elcaro.dev;

  location / {
    proxy_pass http://127.0.0.1:8848;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 30s;
  }

  client_max_body_size 1M;
}
