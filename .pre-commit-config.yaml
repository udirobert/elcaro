repos:
  # ── Secrets detection ────────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
        exclude: |
          (?x)^(
            \.secrets\.baseline|
            eval/Cargo\.lock|
            \.venv/.*
          )$

  # ── Ruff — lint + format ─────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix]
      - id: ruff-format
        name: ruff format

  # ── General file hygiene ─────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]          # catch accidentally staged WASM binaries

  # ── Supply chain scanning (Ossprey) — runs on push, not commit ──────────────
  - repo: local
    hooks:
      - id: ossprey-scan
        name: ossprey supply-chain scan
        entry: bash -c 'command -v ossprey >/dev/null 2>&1 && ossprey scan . && ossprey scan ./app/web || echo "⚠ Ossprey CLI not installed — skipping supply chain scan"'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
