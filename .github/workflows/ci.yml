name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test & Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[all]"

      - name: Lint
        run: |
          ruff check
          ruff format --check

      - name: Test
        run: python -m pytest -v

  build-frontend:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: app/web

      - name: Build
        run: npm run build
        working-directory: app/web
        env:
          ELCARO_MINER_URL: http://localhost:8000

  supply-chain-scan:
    name: Supply Chain (Ossprey)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ossprey CLI
        run: curl -fsSL https://github.com/ossprey/ossprey-cli/releases/latest/download/install.sh | sudo sh

      - name: Scan Python dependencies
        env:
          OSSPREY_API_KEY: ${{ secrets.OSSPREY_API_KEY }}
        run: ossprey scan .

      - name: Scan Node.js dependencies
        env:
          OSSPREY_API_KEY: ${{ secrets.OSSPREY_API_KEY }}
        run: ossprey scan ./app/web
