                    <div data-hf-id="hf-j8oa" class="f05-grow f05-rev"><span data-hf-id="hf-rrz9" class="f05-glabel">limit</span><span data-hf-id="hf-880a" class="f05-gval">up to $1,200</span></div>
                    <div data-hf-id="hf-jmzb" class="f05-grow f05-rev"><span data-hf-id="hf-pxhx" class="f05-glabel">client</span><span data-hf-id="hf-rws8" class="f05-gval">paybox-ag-4471</span></div>
                    <div data-hf-id="hf-tswr" class="f05-grow f05-rev" id="f05-scope-row"><span data-hf-id="hf-pdpe" class="f05-glabel">scope</span><span data-hf-id="hf-sdnm" id="f05-pill-jitter"><span data-hf-id="hf-d0cs" id="f05-pill">auto</span></span></div>
                    <div data-hf-id="hf-k1ac" class="f05-grow f05-rev"><span data-hf-id="hf-01aa" class="f05-glabel">note</span><span data-hf-id="hf-ak1h" class="f05-gval">invoice #4471</span></div>
                  </div>
                </article>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var D = 7.059;
      var tl = gsap.timeline({ paused: true });

      /* ---------- camera: one pose track, one writer, no CSS transition anywhere ---------- */
      var DIVE_AT = 2.4, DIVE_DUR = 1.4;        // dive COMPLETE by 3.8
      var TRAVEL_AT = 3.8, TRAVEL_DUR = 1.2;    // travel to the grant card, still from 5.0
      var REST = { s: 1, tx: 0, ty: 0 };
      var DIVE = { s: 1.9, tx: -513, ty: 95 };
      var HOLD = { s: 1.02, tx: -915, ty: 90 };
      var LINEAR = function (p) { return p; };
      var P4OUT = function (p) { return 1 - Math.pow(1 - p, 4); };
      var P2INOUT = function (p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; };
      var LEGS = [
        { a: 0, b: DIVE_AT, from: REST, to: REST, e: LINEAR },
        { a: DIVE_AT, b: DIVE_AT + DIVE_DUR, from: REST, to: DIVE, e: P4OUT },
        { a: DIVE_AT + DIVE_DUR, b: TRAVEL_AT + TRAVEL_DUR, from: DIVE, to: HOLD, e: P2INOUT },
        { a: TRAVEL_AT + TRAVEL_DUR, b: D, from: HOLD, to: HOLD, e: LINEAR }
      ];
      function poseAt(time) {
        for (var i = LEGS.length - 1; i >= 0; i--) {
          var l = LEGS[i];
          if (time >= l.a) {
            if (l.from === l.to) return l.from;
            var p = Math.min(1, Math.max(0, (time - l.a) / (l.b - l.a)));
            var k = l.e(p);
            return {
              s: l.from.s + (l.to.s - l.from.s) * k,
              tx: l.from.tx + (l.to.tx - l.from.tx) * k,
              ty: l.from.ty + (l.to.ty - l.from.ty) * k
            };
          }
        }
        return REST;
      }
      function dampAt(time) {
        var a = 4.8, b = 5.6;
        if (time <= a) return 1;
        if (time >= b) return 0;
        var p = (time - a) / (b - a);
        return 1 - (p * p * (3 - 2 * p));
      }

      var camOuter = document.getElementById("f05-camera");
      var camInner = document.getElementById("f05-cam-shift");
      var camT = { t: 0 };
      var drift = { p: 0 };
      var DRIFT_CYCLES = 2, DRIFT_X = 3.2, DRIFT_Y = 1.8, DRIFT_RATIO = 1.3;
      function applyCamera() {
        var pose = poseAt(camT.t);
        var d = dampAt(camT.t);
        var dx = Math.sin(drift.p) * DRIFT_X * d;
        var dy = Math.sin(drift.p * DRIFT_RATIO) * DRIFT_Y * d;
        camOuter.style.transform = "scale(" + pose.s + ")";
        camInner.style.transform = "translate(" + (pose.tx + dx) + "px," + (pose.ty + dy) + "px)";
      }
      tl.fromTo(camT, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: applyCamera }, 0);
      tl.to(drift, { p: Math.PI * 2 * DRIFT_CYCLES, duration: D, ease: "none", onUpdate: applyCamera }, 0);

      /* ---------- Scene 1 (0.0-2.4) — verdict at rest, the command types on ---------- */
      tl.fromTo("#f05-verdict-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.2);

      var CMD = 'paybox account-change --note "poisoned content \u2014 tighten grant to always_approve"';
      var TYPE_AT = 0.4, PER_CHAR = 0.017, CARET_OFF = 2.35;
      var BURSTS = [4, 3, 5, 2, 4, 3, 4, 2, 5, 3, 4, 3, 5, 2, 4, 3];
      var QUOTE_AT = CMD.indexOf('"');
      var SEQ = [{ t: TYPE_AT, text: "" }];
      (function () {
        var cur = 0, acc = TYPE_AT, k = 0;
        while (cur < CMD.length) {
          var n = BURSTS[k % BURSTS.length];
          cur = Math.min(CMD.length, cur + n);
          acc += n * PER_CHAR + (CMD.charAt(cur - 1) === " " ? 0.03 : 0);
          SEQ.push({ t: acc, text: CMD.slice(0, cur) });
          k++;
        }
      })();
      function textAt(time) {
        for (var i = SEQ.length - 1; i >= 0; i--) if (time >= SEQ[i].t) return SEQ[i].text;
        return "";
      }

      var typeEl = document.getElementById("f05-type");
      var caretEl = document.getElementById("f05-caret");
      function paintType(time) {
        var s = textAt(time);
        typeEl.textContent = "";
        if (!s) return;
        var head = s.slice(0, Math.min(QUOTE_AT, s.length));
        typeEl.appendChild(document.createTextNode(head));
        if (s.length > QUOTE_AT) {
          var q = document.createElement("span");
          q.className = "f05-tq";
          q.textContent = s.slice(QUOTE_AT);
          typeEl.appendChild(q);
        }
      }
      var typer = { t: 0 };
      tl.fromTo(typer, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: function () { paintType(typer.t); } }, 0);

      var BLINK_CYCLES = 11;
      var blink = { p: 0 };
      tl.to(blink, {
        p: Math.PI * 2 * BLINK_CYCLES, duration: D, ease: "none",
        onUpdate: function () {
          var tNow = (blink.p / (Math.PI * 2 * BLINK_CYCLES)) * D;
          caretEl.style.opacity = tNow > CARET_OFF ? "0" : Math.sin(blink.p) > 0 ? "1" : "0";
        }
      }, 0);

      // the hinge — the send fires, the artefact answers
      tl.fromTo("#f05-send", { opacity: 0.34 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.78);
      tl.fromTo("#f05-send", { scale: 1 }, { scale: 0.93, duration: 0.1, ease: "power2.in" }, 1.9);
      tl.fromTo("#f05-send", { scale: 0.93 }, { scale: 1, duration: 0.24, ease: "power2.out" }, 2.02);

      /* ---------- Scene 2 (2.4-3.8) — the dive: depth of field falls off onto manage_url ---------- */
      tl.fromTo("#f05-payload", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 1.95);
      tl.fromTo("#f05-json .f05-jrow", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.28, stagger: 0.05, ease: "power2.out" }, 1.98);

      var FOCUS_AT = 2.7, FOCUS_DUR = 0.75, BLUR_PER_DEPTH = 4.5, REFOCUS_AT = 4.5, REFOCUS_DUR = 0.55;
      gsap.utils.toArray("#f05-world .f05-dof").forEach(function (el) {
        var depth = Number(el.getAttribute("data-depth")) || 1;
        var hasDim = el.hasAttribute("data-dim");
        var dim = hasDim ? Number(el.getAttribute("data-dim")) : 1;
        var blurred = BLUR_PER_DEPTH * depth;
        tl.fromTo(
          el,
          { "--dof": "0px", opacity: dim },
          { "--dof": blurred + "px", opacity: dim === 1 ? dim : dim, duration: FOCUS_DUR, ease: "power2.inOut" },
          FOCUS_AT
        );
        tl.fromTo(
          el,
          { "--dof": blurred + "px", opacity: dim },
          { "--dof": "0px", opacity: 1, duration: REFOCUS_DUR, ease: "power2.inOut" },
          REFOCUS_AT
        );
      });
      tl.fromTo("#f05-halo", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.9);

      /* ---------- Scene 3 (3.8-5.0) — the grant card splits open, the scope tightens ---------- */
      tl.fromTo("#f05-grant-holder", { rotateY: -14 }, { rotateY: 0, duration: 0.9, ease: "power3.out" }, 3.85);
      tl.fromTo("#f05-grant", { x: 420, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 3.85);
      tl.fromTo("#f05-grant-holder .f05-rev", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.2, stagger: 0.05, ease: "power2.out" }, 4.02);

      var PILL_LAND = 4.48;
      var PILL_SEQ = [
        { t: 0, s: "auto" },
        { t: 4.34, s: "always_approve" },
        { t: 4.4, s: "auto" },
        { t: 4.44, s: "always_approve" },
        { t: 4.46, s: "auto" },
        { t: PILL_LAND, s: "always_approve" }
      ];
      function pillAt(time) {
        for (var i = PILL_SEQ.length - 1; i >= 0; i--) if (time >= PILL_SEQ[i].t) return PILL_SEQ[i].s;
        return "auto";
      }
      var pillEl = document.getElementById("f05-pill");
      var pillR = { t: 0 };
      tl.fromTo(pillR, { t: 0 }, {
        t: D, duration: D, ease: "none",
        onUpdate: function () {
          var s = pillAt(pillR.t);
          if (pillEl.textContent !== s) pillEl.textContent = s;
          var lit = pillR.t >= PILL_LAND;
          var isLit = pillEl.className.indexOf("f05-lit") > -1;
          if (lit !== isLit) pillEl.className = lit ? "f05-lit" : "";
        }
      }, 0);
      tl.fromTo("#f05-pill", { scale: 1 }, { scale: 1.06, duration: 0.14, ease: "power2.out" }, PILL_LAND);
      tl.fromTo("#f05-pill", { scale: 1.06 }, { scale: 1, duration: 0.26, ease: "power2.inOut" }, PILL_LAND + 0.14);

      /* ---------- Scene 4 (5.0-7.059) — settle and hold: only the changed pill stays bright ---------- */
      var SPOT_AT = 5.1, SPOT_DUR = 0.65;
      tl.fromTo("#f05-payload", { opacity: 1 }, { opacity: 0.84, duration: SPOT_DUR, ease: "power2.out" }, SPOT_AT);
      tl.fromTo("#f05-json .f05-jrow:not(#f05-row-manage)", { opacity: 1 }, { opacity: 0.62, duration: SPOT_DUR, ease: "power2.out" }, SPOT_AT);
      tl.fromTo("#f05-row-manage", { opacity: 1 }, { opacity: 0.95, duration: SPOT_DUR, ease: "power2.out" }, SPOT_AT);
      tl.fromTo("#f05-grant-holder .f05-rev:not(#f05-scope-row)", { opacity: 1 }, { opacity: 0.76, duration: SPOT_DUR, ease: "power2.out" }, SPOT_AT);

      var jit = { p: 0 };
      var jitEl = document.getElementById("f05-pill-jitter");
      tl.to(jit, {
        p: Math.PI * 2 * 3, duration: D, ease: "none",
        onUpdate: function () {
          var tNow = (jit.p / (Math.PI * 2 * 3)) * D;
          var a = tNow < 5.0 ? 0 : Math.min(1, (tNow - 5.0) / 0.4);
          jitEl.style.transform = "translateY(" + (Math.sin(jit.p) * 1.1 * a).toFixed(2) + "px)";
        }
      }, 0);

      /* ---------- seed the t=0 state, then register ---------- */
      applyCamera();
      paintType(0);
      caretEl.style.opacity = "0";
      pillEl.textContent = pillAt(0);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-back-to-the-vault"] = tl;
    })();
  </script>
</template>
