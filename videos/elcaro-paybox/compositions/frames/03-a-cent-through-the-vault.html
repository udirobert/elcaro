  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      var world   = document.getElementById("ac-world");
      var typed   = document.getElementById("ac-typed");
      var caret   = document.getElementById("ac-caret");
      var chipnum = document.getElementById("ac-chipnum");
      var kw      = document.getElementById("ac-kw");

      /* ---------------------------------------------------------------
         Camera (viewport-change): single .world wrapper, single cam obj,
         ONE writer. Focus-lock target = settlement chip center.
         chip left:1290 top:320 w:530 h:320 -> center (1555, 480)
         viewport center (960, 540) -> offset (595, -60)
         single-wrapper counter-translate: T = -offset * S
      --------------------------------------------------------------- */
      var TARGET_SCALE = 1.14;
      var CHIP_OFFX = 1555 - 960;   // 595
      var CHIP_OFFY = 480 - 540;    // -60
      var cam = { scale: 1, x: 0, y: 0 };
      function applyCamera() {
        world.style.transform =
          "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
      }
      applyCamera(); // seed frame 0 = neutral

      /* ---------------------------------------------------------------
         Scene 1 (0.0-1.95): dark ground holds; negation pill enters
         fast and EXITS on a short directional x-tween with a brief
         blur on the leaving element only (realised motion-blur streak).
      --------------------------------------------------------------- */
      tl.fromTo("#ac-kicker", { opacity: 0, y: -14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.15);

      tl.fromTo("#ac-reject", { opacity: 0, x: -26 },
        { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0.15);
      // negation lands as VO finishes ("...bolted to the side") @1.92
      tl.to("#ac-reject", {
        x: 940, opacity: 0, filter: "blur(16px)",
        duration: 0.5, ease: "power2.in"
      }, 1.35);

      /* ---------------------------------------------------------------
         Scene 2 (1.95-3.0): terminal pill spring-pops centre-left and
         types the real x402 command, line-broken at flag boundaries
         (full-width legibility, no shrinking), behind a caret-tracking
         frontier.
      --------------------------------------------------------------- */
      tl.fromTo("#ac-term",
        { opacity: 0, scale: 0.93, y: 22 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.2)" }, 1.95);

      var CMD = "paybox use-service\n" +
                "  --credential $EVM\n" +
                "  --url https://elcaro.trustfall.xyz/api/x402/scan\n" +
                "  --method POST";
      var TY_AT = 2.05, TY_DUR = 1.30;
      var ty = { i: 0 };
      tl.to(ty, {
        i: CMD.length, duration: TY_DUR, ease: "none",
        onUpdate: function () { typed.textContent = CMD.slice(0, Math.floor(ty.i)); }
      }, TY_AT);
      // sanctioned residual motion: a few discrete caret blinks (no repeat/yoyo)
      var blinkAt = 3.40;
      for (var b = 0; b < 5; b++) {
        tl.set(caret, { opacity: 0 }, blinkAt + b * 0.30);
        tl.set(caret, { opacity: 1 }, blinkAt + b * 0.30 + 0.15);
      }

      /* ---------------------------------------------------------------
         Scene 3 (3.0-5.2): settlement chip stamps in beside the vault;
         value-scaled counter to $0.01 fires on the spoken "cent" @3.00,
         then the receipt streams word by word as the vault is named
         (per-word staggered reveal).
      --------------------------------------------------------------- */
      tl.fromTo("#ac-chip", { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 2.55);

      // counting-dynamic-scale: proxy value + transform scale share timing/ease
      var CNT_AT = 3.00, CNT_DUR = 0.80;   // fires exactly on "cent", never t=0
      var START_SCALE = 0.55;              // START_SIZE / END_SIZE (~55%)
      var cv = { v: 0 };
      tl.to(cv, {
        v: 1, duration: CNT_DUR, ease: "power3.out",
        onUpdate: function () { chipnum.textContent = "$0.0" + String(Math.round(cv.v)); }
      }, CNT_AT);
      tl.fromTo(chipnum, { scale: START_SCALE },
        { scale: 1, duration: CNT_DUR, ease: "power3.out" }, CNT_AT);
      // vault address lands as VO names it ("through your own PayBox vault")
      tl.fromTo(".ac-chip-vault", { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.45);

      // receipt streams word by word as VO names the vault @3.47-4.60
      tl.fromTo("#ac-output .ac-word",
        { opacity: 0, x: -12 },
        { opacity: 1, x: 0, duration: 0.34, ease: "power2.out", stagger: 0.13 }, 3.47);

      tl.fromTo("#ac-foot", { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 3.4);

      /* ---------------------------------------------------------------
         Scene 4 (5.2-7.198): pan / focus-lock (viewport-change) onto the
         chip, single keyword glow on "vault" @6.04, then stillness.
         No exit; no back-half push.
      --------------------------------------------------------------- */
      var ZM_AT = 5.20, ZM_DUR = 1.30;
      tl.to(cam, {
        scale: TARGET_SCALE,
        x: -CHIP_OFFX * TARGET_SCALE,
        y: -CHIP_OFFY * TARGET_SCALE,
        duration: ZM_DUR, ease: "power3.inOut", onUpdate: applyCamera
      }, ZM_AT);

      // asr-keyword-glow (static-timeline variant): coral bloom on the key word
