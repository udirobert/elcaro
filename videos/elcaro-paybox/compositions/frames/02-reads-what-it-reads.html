  <script>
    (function () {
      var FRAME_ID = "02-reads-what-it-reads";
      var DURATION = 9.381;

      var tl = gsap.timeline({ paused: true });

      // ─────────────────────────────────────────────────────────────
      // Scene 1 (0.0–2.2) — anchor builds word-by-word on its spoken
      // cues (dynamic-content-sequencing: per-item cue times, pre-placed
      // so the pinned line never re-lays-out).
      // ─────────────────────────────────────────────────────────────
      var ANCHOR_CUES = [
        ["#f02-a1", 0.07],
        ["#f02-a2", 1.16],
        ["#f02-a3", 1.37],
        ["#f02-a4", 1.53],
        ["#f02-a5", 1.69],
        ["#f02-a6", 2.14],
      ];
      ANCHOR_CUES.forEach(function (cue) {
        tl.fromTo(
          cue[0],
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" },
          cue[1],
        );
      });

      // ─────────────────────────────────────────────────────────────
      // discrete-text-sequence driver — one linear proxy on the timeline;
      // every HARD-CUT state (the appended tail rail, the cycling object
      // slot) is a reverse-search over a sparse state array. No tweening
      // between states: the jumps are instant.
      // ─────────────────────────────────────────────────────────────
      // Scene 2 (2.2–3.4) — "— before it acts" appends on the same rail;
      // the accent lands on "acts" at 2.87.
      var TAIL_STATES = [
        { t: 0.0, n: 0 },
        { t: 2.23, n: 2 }, // "—" + "before"
        { t: 2.69, n: 3 }, // + "it"
        { t: 2.87, n: 4 }, // + "acts" (coral)
      ];
      // Scene 3 (3.4–5.9) — one swap per spoken noun; the block clears at 5.99.
      var SLOT_STATES = [
        { t: 0.0, text: "" },
        { t: 3.42, text: "emails" },
        { t: 3.96, text: "pages" },
        { t: 4.44, text: "plugins" },
        { t: 4.88, text: "transcripts" },
        { t: 5.99, text: "" },
      ];

      function stateAt(states, time) {
        for (var i = states.length - 1; i >= 0; i--) {
          if (time >= states[i].t) return states[i];
        }
        return states[0];
      }

      var tailEls = Array.prototype.slice.call(document.querySelectorAll(".f02-tail"));
      var slotEl = document.getElementById("f02-slot-word");
      var lastTailN = -1;
      var lastSlotText = null;

      function syncDiscrete(time) {
        var tailN = stateAt(TAIL_STATES, time).n;
        if (tailN !== lastTailN) {
          for (var i = 0; i < tailEls.length; i++) {
            tailEls[i].style.opacity = i < tailN ? "1" : "0";
          }
          lastTailN = tailN;
        }
        var text = stateAt(SLOT_STATES, time).text;
        if (text !== lastSlotText) {
          slotEl.textContent = text;
          lastSlotText = text;
        }
      }

      var driver = { t: 0 };
      syncDiscrete(0); // deterministic initial state, before the first seek
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            syncDiscrete(driver.t);
          },
        },
        0,
      );

      // Scene 2 — the hairline rule draws on as the tail lands (marks the
      // boundary the cycling slot stays behind).
      tl.fromTo(
        "#f02-rail",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.62, ease: "power3.out" },
        2.23,
      );

      // Scene 3 — the slot opens, then rolls the call.
      tl.fromTo(
        "#f02-cycle",
        { opacity: 0 },
        { opacity: 1, duration: 0.28, ease: "power2.out" },
        3.3,
      );

      // Each cleared noun spring-pops into the chip row (restrained, no bounce).
      var CHIP_CUES = [
        ["#f02-chip-0", 3.96],
        ["#f02-chip-1", 4.44],
        ["#f02-chip-2", 4.88],
        ["#f02-chip-3", 5.6],
      ];
      CHIP_CUES.forEach(function (cue) {
        tl.fromTo(
          cue[0],
          { opacity: 0, scale: 0.72, y: 8 },
          { opacity: 1, scale: 1, y: 0, duration: 0.34, ease: "power3.out" },
          cue[1],
        );
      });

      // Scene 4 (5.9–9.381) — the cycle + chip row clear; the anchor stays pinned.
      tl.to(
        "#f02-cycle",
        { opacity: 0, duration: 0.18, ease: "power1.in" },
        5.99,
      );
      tl.to(
        "#f02-chips",
        { opacity: 0, duration: 0.18, ease: "power1.in" },
        5.99,
      );

      // Ambient bloom — soft radial, un-triggered, long-tail settle into the hold.
      tl.fromTo(
        "#f02-bloom",
        { opacity: 0, scale: 1.06 },
        { opacity: 1, scale: 1, duration: 2.3, ease: "power2.out" },
        6.85,
      );

      // The resolving dominant line — each word on its spoken cue, then holds still.
      var RESOLVE_CUES = [
        ["#f02-r1", 6.93, 0.3],
        ["#f02-r2", 7.1, 0.3],
        ["#f02-r3", 7.47, 0.3],
        ["#f02-r4", 7.66, 0.3],
        ["#f02-r5", 7.92, 0.28],
        ["#f02-r6", 8.05, 0.3],
        ["#f02-r7", 8.38, 0.28],
        ["#f02-r8", 8.63, 0.26],
        ["#f02-r9", 8.69, 0.46],
      ];
      RESOLVE_CUES.forEach(function (cue) {
        tl.fromTo(
          cue[0],
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: cue[2], ease: "power3.out" },
          cue[1],
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
      tl.seek(0);
    })();
  </script>
