        0.05,
      );
      tl.fromTo(
        sel("index"),
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.16,
      );

      /* the symmetry axis draws down between the two wings */
      tl.fromTo(
        sel("axis"),
        { opacity: 0, scaleY: 0 },
        { opacity: 1, scaleY: 1, duration: 0.95, ease: "power2.inOut" },
        0.18,
      );

      /* mirrored book-open: left +TILT faces right, right -TILT faces left */
      tl.fromTo(
        cardL,
        { x: -ENTRY_SLIDE_DIST, rotateY: TILT + TILT_OVERSHOOT, scale: 0.85, opacity: 0 },
        {
          x: 0,
          rotateY: TILT,
          scale: 1,
          opacity: 1,
          duration: ENTRY_DUR,
          ease: "power3.out",
        },
        LEFT_AT,
      );
      tl.fromTo(
        cardR,
        { x: ENTRY_SLIDE_DIST, rotateY: -TILT - TILT_OVERSHOOT, scale: 0.85, opacity: 0 },
        {
          x: 0,
          rotateY: -TILT,
          scale: 1,
          opacity: 1,
          duration: ENTRY_DUR,
          ease: "power3.out",
        },
        RIGHT_AT,
      );

      /* ============ SCENE 2 (2.5-4.3) — "Risk zero" @2.58-3.10, "Safe" @3.54 ====
         dynamic-content-sequencing: each readout's word grid is reduced ONCE from
         the spoken anchor + a per-char term, so the stagger is content-driven. ==== */
      var SEC_PER_CHAR = 0.0825;
      var MIN_GAP = 0.08;
      function spread(anchor, words) {
        var t = anchor;
        return words.map(function (w) {
          var at = t;
          t += Math.max(MIN_GAP, w.textContent.length * SEC_PER_CHAR);
          return { el: w, at: at };
        });
      }
      var WORD_CUES = [
        /* left — already at rest, muted: one quiet cadence off "Risk" */
        spread(2.58, [sel("lw-1"), sel("lw-2"), sel("lw-3"), sel("lw-4")]),
        /* right — "risk" on "Risk", "0.00" on "zero" @2.95, "safe" on "Safe" @3.54 */
        spread(2.62, [sel("rw-1"), sel("rw-2")]),
        spread(3.46, [sel("rw-3"), sel("rw-4")]),
      ];
      WORD_CUES.forEach(function (group, gi) {
        group.forEach(function (w) {
          tl.fromTo(
            w.el,
            { opacity: 0, y: gi === 0 ? 5 : 9 },
            {
              opacity: 1,
              y: 0,
              duration: gi === 0 ? 0.34 : 0.26,
              ease: "power2.out",
            },
            w.at,
          );
        });
      });

      /* ============ SCENE 3 (4.3-5.6) — "Go means go" @4.39-5.20 ============ */
      /* the poisoned side steps back: card and its readout together to ~45% */
      tl.to(cardL, { opacity: 0.45, duration: 0.7, ease: "power1.inOut" }, 4.39);
      tl.to(sel("read-left"), { opacity: 0.45, duration: 0.7, ease: "power1.inOut" }, 4.39);

      /* ambient bloom on the GO badge — soft radial opacity, no new hue, no violet */
      tl.fromTo(
        sel("halo"),
        { opacity: 0 },
        { opacity: 1, duration: 0.62, ease: "power2.out" },
        4.46,
      );
      tl.fromTo(
        sel("core"),
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power2.out" },
        4.62,
      );

      /* button press settle on "go" @4.89 — the card takes the press, the bloom releases */
      tl.to(cardR, { scale: 0.985, duration: 0.11, ease: "power2.in" }, 4.89);
      tl.to(cardR, { scale: 1, duration: 0.36, ease: "power2.out" }, 5.0);
      tl.fromTo(
        sel("halo"),
        { scale: 0.94 },
        { scale: 1.02, duration: 0.5, ease: "power2.out" },
        4.94,
      );

      /* ============ SCENE 4 (5.6-8.545) — "a gate that blocks everything protects
         nothing" @5.89-8.50: both cards hold; the payoff line is ALREADY printed
         inside the right capture, so it takes the sweep instead of new type. ==== */
      tl.fromTo(
        sel("hl-1"),
        { opacity: 1, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 1.06, ease: "power2.out" },
        5.89,
      );
      tl.fromTo(
        sel("hl-2"),
        { opacity: 1, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.62, ease: "power2.out" },
        7.55,
      );

      /* counter-phase idle float, registered as the closing subtle jitter:
         left sin(t), right sin(t+PI) — never synchronized, never a conveyor belt */
      var JITTER_AT = 2.4;
      var JITTER_DUR = DURATION - JITTER_AT;
      var JITTER_CYCLES = JITTER_DUR / 2.6;
      var jit = { p: 0 };
      tl.to(
        jit,
        {
          p: Math.PI * 2 * JITTER_CYCLES,
          duration: JITTER_DUR,
          ease: "none",
          onUpdate: function () {
            var amp = jit.p > Math.PI * 2 * 1.3 ? 1.7 : 1.2;
            var y = Math.sin(jit.p) * amp;
            var x = Math.sin(jit.p * 0.5 + 0.8) * 0.6;
            jitL.style.transform =
              "translate3d(" + x.toFixed(2) + "px, " + y.toFixed(2) + "px, 0)";
            jitR.style.transform =
              "translate3d(" + (-x).toFixed(2) + "px, " + (-y).toFixed(2) + "px, 0)";
          },
        },
        JITTER_AT,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
</template>
