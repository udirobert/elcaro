      var DURATION = 6.409;

      var tl = gsap.timeline({ paused: true });

      /* ============ SCENE 1 (0.0-1.15) — "Elcaro" @0.03-1.16 ============ */

      /* ============ SCENE 3 (3.3-6.409) — the endpoint, typed.

        sel("pill"),
        { opacity: 0, scale: 0.86, y: 26 },
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.62,
          ease: "back.out(1.7)",
          transformOrigin: "50% 100%",

        3.31,
      );
      tl.fromTo(sel("caret"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, 3.9);

      /* context-sensitive-cursor: the caret colour follows the segment being typed */
      var SEGMENTS = [
        { t: 0, text: "paybox", color: "#fafaf8" },
        { t: 6, text: " use-service", color: "#fafaf8" },
        { t: 18, text: " --url ", color: "rgba(250,250,248,0.45)" },
        { t: 25, text: "https://elcaro.trustfall.xyz/api/x402/scan", color: "#5db8a6" },
      ];
      var FULL = SEGMENTS.map(function (s) {
        return s.text;

      var TYPE_START = 3.95;
      var TYPE_END = 5.85;
      var TYPE_DUR = TYPE_END - TYPE_START;
      var line = sel("line");

        var c = SEGMENTS[0].color;
