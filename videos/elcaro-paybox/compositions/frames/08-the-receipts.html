  <script>
    (function () {
      var FRAME_ID = "08-the-receipts";
      var sel = function (name) {
        return document.getElementById(FRAME_ID + "-" + name);
      };

      var tl = gsap.timeline({ paused: true });

      var cam = sel("cam");

      /* ============ SCENE 1 (0.0-1.7) — "Five for five" @0.10-1.35,
         the second "five" @1.00: the counter is the whole frame. ============ */
      tl.fromTo(
        sel("kicker"),
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.05,
      );
      tl.fromTo(
        sel("index"),
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.14,
      );
      tl.fromTo(
        sel("ghost"),
        { opacity: 0 },
        { opacity: 0.22, duration: 1.1, ease: "power1.out" },
        0.3,
      );

      /* counting-dynamic-scale: proxy value + scale on the SAME ease/duration.
         COUNT_DUR 0.85s — the eye has to read the digits going past. */
      var C1 = { v: 0 };
      var C1_DUR = 0.85;
      tl.fromTo(
        sel("i1-num"),
        { opacity: 0 },
        { opacity: 1, duration: 0.2, ease: "none" },
        0.16,
      );
      tl.to(
        C1,
        {
          v: 5,
          duration: C1_DUR,
          ease: "power3.out",
          onUpdate: function () {
            sel("i1-val").textContent = String(Math.round(C1.v));
          },
        },
        0.2,
      );
      tl.fromTo(
        sel("i1-num"),
        { scale: 0.58 },
        { scale: 1, duration: C1_DUR, ease: "power3.out" },
        0.2,
      );
      /* the paired graphic lands with the count, not after it */
      tl.to(
        [sel("bar-1"), sel("bar-2"), sel("bar-3"), sel("bar-4"), sel("bar-5")],
        { scaleY: 1, duration: 0.45, ease: "power3.out", stagger: 0.08 },
        0.22,
      );
      tl.fromTo(
        sel("i1-lab"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.42,
      );
      /* the denominator is punctuation — it arrives once the number has landed */
      tl.fromTo(
        sel("i1-den"),
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.42, ease: "back.out(1.6)" },
        1.05,
      );

      /* ============ SCENE 2 (1.7-4.3) — "$24,600 protected" @1.71-3.90.
         multi-phase-camera phase 1: PUSH THROUGH the centre of the 5/5. The
         instrument flies past the frame on its own scale while the camera leans in,
         and the hero resolves out of the push at the same centre. ============ */

        cam,
        { scale: 1.45, duration: 0.9, ease: "power2.inOut" },
        1.7,
      );
      tl.to(
        sel("i1"),
        { scale: 1.75, duration: 0.9, ease: "power2.in" },
        1.7,
      );
      tl.to(sel("i1"), { opacity: 0, duration: 0.42, ease: "power1.in" }, 1.78);

      tl.fromTo(
        sel("hero"),
        { opacity: 0, scale: 1.3 },
        { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" },
        2.05,
      );

      var H = { v: 0 };
      var H_START = 2.1;
      var H_DUR = 1.25;
      tl.to(
        H,
        {
          v: 24600,
          duration: H_DUR,
          ease: "power3.out",
          onUpdate: function () {
            sel("hero-val").textContent = Math.round(H.v).toLocaleString("en-US");
          },
        },
        H_START,
      );
      tl.fromTo(
        sel("hero-num"),
        { scale: 0.74 },
        { scale: 1, duration: H_DUR, ease: "power3.out" },
        H_START,
      );
      tl.fromTo(
        sel("hero-cur"),
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out" },
        H_START,
      );
      tl.fromTo(
        sel("hero-lab"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        3.44,
      );
      /* stat-bars-and-fills (bar form): the fill runs AFTER the number lands —
         the count gets its own beat, the wipe closes it. */
      tl.fromTo(
        sel("hero-track"),
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "none" },
        3.40,
      );
      tl.to(sel("hero-fill"), { scaleX: 1, duration: 0.7, ease: "power2.out" }, 3.5);

      /* ============ SCENE 3 (4.3-6.3) — "zero false positives" @4.54-5.80.
         Bookend-pull: the camera eases back OUT to the wider seat, which is where
         the three-up row lives. The control stat is muted on purpose — a
         false-positive counter that glowed would sell the wrong thing. ============ */
      tl.to(cam, { scale: 0.92, duration: 0.85, ease: "power2.inOut" }, 4.3);
      tl.fromTo(
        [sel("div-l"), sel("div-r")],
        { opacity: 0, scaleY: 0.2 },
        { opacity: 1, scaleY: 1, duration: 0.6, ease: "power2.inOut" },
        4.42,
      );
      tl.fromTo(
        sel("cell0-num"),
        { opacity: 0, y: 16, scale: 0.88 },
        { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "power3.out" },
        4.54,
      );
      tl.fromTo(
        sel("cell0-lab"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
        5.0,
      );

      /* ============ SCENE 4 (6.3-8.824) — "six gates" @6.31-7.10,
         "paid through the vault" @7.60-8.50: the last cell completes the row. ==== */
      var S = { v: 0 };
      tl.to(
        S,
        {
          v: 6,
          duration: 0.7,
          ease: "power2.out",
          onUpdate: function () {
            sel("cell6-num").textContent = String(Math.round(S.v));
          },
        },
        6.55,
      );
      tl.fromTo(
        sel("cell6-num"),
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" },
        6.55,
      );
      tl.fromTo(
        sel("cell6-lab"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" },
        8.38,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
