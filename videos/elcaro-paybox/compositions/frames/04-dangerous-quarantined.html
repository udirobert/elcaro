      );
      /* the hero owns the canvas once it lands — the ghost terminal steps back */
      tl.to(sel("panel"), { opacity: 0.09, duration: 0.9, ease: "power1.inOut" }, 0.7);

      /* ============ SCENE 1 (0.0–2.7) — "Watch" @0.05, "Risk 0.73" @1.01–2.20 ============ */
      tl.fromTo(
        sel("eyebrow"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.05,
      );
      tl.fromTo(
        sel("hero"),
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.12,
      );

      var count = { value: 0 };
      tl.to(
        count,
        {
          value: TARGET_VALUE,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            counter.textContent = count.value.toFixed(2);
          },
        },
        COUNT_AT,
      );
      tl.fromTo(
        counter,
        { scale: START_SCALE },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_AT,
      );

      /* working-state caret — sin square wave on the timeline, killed when the verdict lands */
      var CARET_AT = 0.16;
      var CARET_DUR = 2.81 - CARET_AT;
      var BLINK_CYCLES = Math.round(CARET_DUR / 0.62);
      var blink = { p: 0 };
      tl.set(caret, { opacity: 1 }, CARET_AT);
      tl.to(
        blink,
        {
          p: Math.PI * 2 * BLINK_CYCLES,
          duration: CARET_DUR,
          ease: "none",
          onUpdate: function () {
            caret.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        CARET_AT,
      );
      tl.set(caret, { opacity: 0 }, 2.81);

      /* the badge holds its SAFE pre-state while the number climbs */
      tl.fromTo(
        badge,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        1.06,
      );

      /* one linear driver; reverse-search the schedule, swap the DOM only on transitions */
      var vDriver = { t: 0 };
      var lastVerdict = "";
      tl.to(
        vDriver,
        {
          t: 3.2,
          duration: 3.2,
          ease: "none",
          onUpdate: function () {
            var state = verdictAt(vDriver.t);
            if (state.text !== lastVerdict) {
              badge.textContent = state.text;
              badge.setAttribute("data-verdict", state.state);
              lastVerdict = state.text;
            }
          },
        },
        0,
      );

      /* ============ SCENE 2 (2.7–4.3) — "Dangerous" @2.81, "Quarantined" @3.56 ============ */
      tl.fromTo(badge, { scale: 1.07 }, { scale: 1, duration: 0.22, ease: "power2.out" }, 2.81);
      tl.fromTo(
        sel("quarantined"),
        { opacity: 0, x: 20 },
        { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" },
        3.56,
      );

      /* svg self-draw — the thin red rule under the verdict, measured not guessed */
      var rulePath = sel("rule-path");
      var ruleLen = rulePath.getTotalLength() * 1.05;
      gsap.set(rulePath, { strokeDasharray: ruleLen, strokeDashoffset: ruleLen });
      tl.to(rulePath, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 3.68);

      /* the exploded scan row completes */
      tl.fromTo(
        sel("latency"),
        { opacity: 0, x: 16 },
        { opacity: 1, x: 0, duration: 0.26, ease: "power2.out" },
        4.04,
      );

      /* ============ SCENE 3 (4.3–8.5) — the receipt lands, token by token ============ */
      tl.fromTo(
        sel("receipt"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        4.28,
      );

      [
        { id: "chunk-s1", at: 4.34 },
        { id: "chunk-s2", at: 4.42 },
        { id: "chunk-s3", at: 4.5 },
      ].forEach(function (c) {
        tl.fromTo(
          sel(c.id),
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" },
          c.at,
        );
      });

      /* proof row — every token on its own spoken cue */
      [
        { id: "chunk-p0", at: 4.56 }, // "the verdict"
        { id: "chunk-p1", at: 5.12 }, // "signed"
        { id: "chunk-p2", at: 5.94 }, // "Key"
        { id: "chunk-p3", at: 6.54 }, // "Payer"
        { id: "chunk-p4", at: 6.66 },
        { id: "chunk-p5", at: 7.17 }, // "verified on Base mainnet"
      ].forEach(function (c) {
        tl.fromTo(
          sel(c.id),
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.24, ease: "power2.out" },
          c.at,
        );
      });

      /* the circle marker closes on "signed" while the word is still being said */
      var circlePath = sel("circle-path");
      var circleLen = circlePath.getTotalLength() * 1.05;
      gsap.set(circlePath, { strokeDasharray: circleLen, strokeDashoffset: circleLen });
      tl.to(circlePath, { strokeDashoffset: 0, duration: 0.66, ease: "power2.out" }, 5.2);

      /* ============ SCENE 4 (8.5–11.61) — the swap never reaches the call ============ */
      tl.fromTo(
        recall,
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
        8.67,
      );

      var strikePath = sel("strike-path");
      var strikeLen = strikePath.getTotalLength() * 1.05;
      gsap.set(strikePath, { strokeDasharray: strikeLen, strokeDashoffset: strikeLen });
      tl.to(strikePath, { strokeDashoffset: 0, duration: 0.62, ease: "power1.inOut" }, 9.44);
      tl.to(recall, { opacity: 0.5, duration: 0.5, ease: "power1.out" }, 9.72);

      /* subtle jitter — the only life on the held verdict block (low end of sine-wave-loop) */
      var JITTER_AT = 8.7;
      var JITTER_DUR = 11.61 - JITTER_AT;
      var JITTER_CYCLES = 1.3;
      var jit = { p: 0 };
      tl.to(
        jit,
        {
          p: Math.PI * 2 * JITTER_CYCLES,
          duration: JITTER_DUR,
          ease: "none",
          onUpdate: function () {
            var y = Math.sin(jit.p) * 1.1 + Math.sin(jit.p * 2.7) * 0.45;
            var x = Math.sin(jit.p * 0.6 + 1.2) * 0.7;
            verdictBlock.style.transform =
              "translate3d(" + x.toFixed(2) + "px, " + y.toFixed(2) + "px, 0)";
          },
        },
        JITTER_AT,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
</template>
