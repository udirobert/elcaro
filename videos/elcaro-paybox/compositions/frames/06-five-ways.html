  <script>
    (function () {
      var FRAME_ID = "06-five-ways";
      var sel = function (name) {
        return document.getElementById(FRAME_ID + "-" + name);
      };

      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0.0–2.0) — plate + mono header, per-word stagger ---------- */
      tl.fromTo(
        sel("plate"),
        { opacity: 0 },
        { opacity: 0.35, duration: 0.7, ease: "power1.out" },
        0,
      );

      var HEADER_WORDS = ["hw-spike", "hw-1", "hw-2", "hw-dot", "hw-3", "hw-4"];
      HEADER_WORDS.forEach(function (id, i) {
        tl.fromTo(
          sel(id),
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
          0.16 + i * 0.13,
        );
      });

      /* ---------- Rows: centre→slot expansion (center-outward-expansion) ----------
         Each row shares the stage centre as origin (top/left 50% + xPercent/yPercent -50
         baked), then radiates out to its slot on its spoken cue. Out-ease only. */
      var EXPAND_DUR = 0.72;
      var EXPAND_EASE = "power3.out";

      function expandRow(n, at) {
        var row = sel("row-" + n);
        var targetY = Number(row.getAttribute("data-target-y"));
        tl.fromTo(
          row,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.62, opacity: 0 },
          { x: 0, y: targetY, scale: 1, opacity: 1, duration: EXPAND_DUR, ease: EXPAND_EASE },
          at,
        );
      }

      /* STOP verdict: a restrained mechanical slam — scale-down into place, no overshoot. */
      function stamp(n, at) {
        tl.fromTo(
          sel("stop-" + n),
          { scale: 1.8, rotation: -9, opacity: 0 },
          { scale: 1, rotation: -2, opacity: 1, duration: 0.17, ease: "power4.out" },
          at,
        );
      }

      /* ---------- Scene 2 (2.0–3.4) — "a doctored invoice" @2.08 ---------- */
      expandRow(1, 2.08);
      stamp(1, 2.74);

      /* ---------- Scene 3 (3.4–5.9) — "reaching for your API keys" @3.44 ---------- */
      expandRow(2, 3.44);
      stamp(2, 5.5);

      /* ---------- Scene 4 (5.9–8.3) — "swaps the whole balance" @5.92 ---------- */
      expandRow(3, 5.92);
      stamp(3, 7.97);

      /* ---------- Scene 5 (8.3–9.9) — "a forged pre-approval" @8.36 ---------- */
      expandRow(4, 8.36);
      stamp(4, 8.92);

      /* ---------- Scene 6 (9.9–12.074) — "a marketplace that bites back" @10.06 ---------- */
      expandRow(5, 10.06);
      stamp(5, 11.76);

      /* held read — subtle jitter on the stack only, no camera move (sine-wave-loop low end) */
      var stack = sel("stack");
      var JITTER_AT = 11.85;
      var JITTER_DUR = 12.074 - JITTER_AT;
      var jit = { p: 0 };
      tl.to(
        jit,
        {
          p: Math.PI * 2 * 1.1,
          duration: JITTER_DUR,
          ease: "none",
          onUpdate: function () {
            var y = Math.sin(jit.p) * 1.1 + Math.sin(jit.p * 2.7) * 0.4;
            var x = Math.sin(jit.p * 0.6 + 1.2) * 0.6;
            stack.style.transform =
              "translate3d(" + x.toFixed(2) + "px, " + y.toFixed(2) + "px, 0)";
          },
        },
        JITTER_AT,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
