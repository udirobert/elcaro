[project]
name = "elcaro"
version = "0.1.0"
description = "IPI detection miner for the Telegraph Protocol"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
miner = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]
app = [
    "httpx>=0.25.0",
]
mcp = [
    "mcp>=2.0.0",
    "httpx>=0.25.0",
]
sandbox = [
    # Tier-2 sandboxed victim agent — Tenki disposable VMs (optional;
    # redteam/tenki_exec.py no-ops without TENKI_API_KEY + this package).
    "tenki>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pyyaml>=6.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
    "detect-secrets>=1.5.0",
]
all = [
    "elcaro[miner,app,mcp,dev]",
]

[tool.setuptools]
packages = ["core", "core.detectors", "redteam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear (common bugs)
    "S",   # flake8-bandit (security)
]
ignore = [
    "S101",  # assert statements — used in tests
    "S603",  # subprocess without shell — not used here but noisy
    "B008",  # function call in default arg — FastAPI uses this pattern
]

[tool.ruff.format]
exclude = ["*.md", "app/web/**/*.ts", "app/web/**/*.tsx"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]         # injection payloads are intentionally long strings
"redteam/*" = ["S311"]            # RNG drives mutation search, not crypto
"app/demo.py" = ["T201"]          # allow print() in the demo script
