# Netlify deployment configuration for the Next.js frontend.
# The miner API runs on a separate VPS — set ELCARO_MINER_URL in Netlify
# environment variables (Site settings → Environment variables).
#
# NOTE: `base` changes Netlify's working directory, so `command` and `publish`
# are resolved RELATIVE TO `base` — do not prefix them with "app/web" again.
# (A prior version had publish = "app/web/.next", which resolved to
# app/web/app/web/.next and failed with "publish directory was not found".)

[build]
  base = "app/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Next.js on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect /api/* to Netlify Functions (handled by the Next.js plugin)
# No manual redirect config needed — the plugin handles API routes.

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
