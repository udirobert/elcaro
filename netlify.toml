# Netlify deployment configuration for the Next.js frontend.
# The miner API runs on a separate VPS — set ELCARO_MINER_URL in Netlify
# environment variables (Site settings → Environment variables).
#
# Gmail extension bridge (/api/engine-ask) — every successful ask spends $0.01
# of the payer wallet's USDC, so it is gated. See
# app/extension/gmail-scan/README.md for the full table.
#   TELEGRAPH_X402_KEY                 payer key, Base Sepolia, holds testnet USDC
#   TELEGRAPH_BRIDGE_TOKEN             optional; requests must send x-bridge-token
#   TELEGRAPH_BRIDGE_DAILY_CAP         per-instance daily ask backstop (default 40)
#   TELEGRAPH_BRIDGE_EXTENSION_IDS     pinned chrome-extension:// ids (set this)
#   TELEGRAPH_BRIDGE_ALLOW_ANY_EXTENSION=0   close the bridge to unpinned ids
#   TELEGRAPH_BRIDGE_ALLOW_NO_ORIGIN   1 to re-allow Origin-less (server) callers
#
# NOTE: `base` changes Netlify's working directory, so `command` and `publish`
# are resolved RELATIVE TO `base` — do not prefix them with "app/web" again.
# (A prior version had publish = "app/web/.next", which resolved to
# app/web/app/web/.next and failed with "publish directory was not found".)

[build]
  base = "app/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # The /swarm dashboards are generated forensic artifacts that inline
  # corpus evidence — real-world strings we do not control, including
  # hex ids that trip generic key-pattern heuristics. Paths are
  # repo-root-relative; glob covers future per-corpus dashboards.
  # Scanning stays on for everything else.
  SECRETS_SCAN_OMIT_PATHS = "app/web/public/swarm/*.html"  # pragma: allowlist secret

# Next.js on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect /api/* to Netlify Functions (handled by the Next.js plugin)
# No manual redirect config needed — the plugin handles API routes.

# ── Security headers ─────────────────────────────────────────────────────────
# Applied to every response. For a security product these are load-bearing —
# someone auditing Elcaro before adopting it will check them.

[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking — already set, kept
    X-Frame-Options = "DENY"

    # MIME sniffing — already set, kept
    X-Content-Type-Options = "nosniff"

    # Referrer — already set, kept
    Referrer-Policy = "strict-origin-when-cross-origin"

    # XSS filter (legacy browsers, belt-and-suspenders)
    X-XSS-Protection = "1; mode=block"

    # Permissions policy — disable browser features Elcaro never uses.
    # camera/microphone/geolocation: none needed for a text-scanning tool.
    # interest-cohort: opt out of FLoC/Topics API.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

    # WebMCP discovery — tells agentic browsers this site exposes WebMCP tools.
    X-WebMCP = "enabled"

    # Content Security Policy.
    # default-src 'self': everything must originate here by default.
    # script-src 'self' 'unsafe-inline': Next.js inline scripts (hydration)
    #   require unsafe-inline; 'unsafe-eval' is NOT included.
    # style-src 'self' 'unsafe-inline': Tailwind inlines critical CSS.
    # img-src 'self' data: blob:: OG images, inline SVGs, scan-beam canvas.
    # font-src 'self': Satoshi + JetBrains Mono are self-hosted (no CDN).
    # connect-src 'self': /api/scan proxy, Netlify form submission.
    # frame-ancestors 'none': belt-and-suspenders with X-Frame-Options.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

# The /swarm findings dashboards are self-contained static artifacts
# (inline CSS/SVG, no scripts, no external resources) embedded via iframe
# by the /swarm page — the global X-Frame-Options DENY + frame-ancestors
# 'none' would block the same-origin embed. Same-origin only, and a CSP
# stricter than the site default since they need almost nothing.
[[headers]]
  for = "/swarm/*.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'; base-uri 'none'; form-action 'none';"

# Long-lived immutable cache for hashed Next.js static assets.
# The /_next/static/ path contains content-hashed filenames — they can be
# cached permanently because any change produces a new filename.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
